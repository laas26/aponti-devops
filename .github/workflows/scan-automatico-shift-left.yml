name: Prática - Scan Automático e Shift-Left

on:
  push:
    paths:
      - 'modulo-devsecops/pratica-scan-automatico-shift-left/**'
      - '.github/workflows/scan-automatico-shift-left.yml'
  pull_request:
    paths:
      - 'modulo-devsecops/pratica-scan-automatico-shift-left/**'

permissions:
  contents: read
  issues: write

jobs:
  # 1. Análise Estática de Segurança no Código Fonte (SAST)
  sast_scan:
    name: SAST - Análise de Código (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v3

      - name: Executar Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/javascript
          src: './modulo-devsecops/pratica-scan-automatico-shift-left'

  # 2. Análise de Composição de Software/Dependências (SCA)
  sca_scan:
    name: SCA - Checagem de Dependências (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v3

      - name: Executar Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './modulo-devsecops/pratica-scan-automatico-shift-left'
          format: 'table'
          severity: 'HIGH,CRITICAL'

  # 3. Análise Dinâmica na Aplicação em Execução (DAST)
  dast_scan:
    name: DAST - Análise na Aplicação (OWASP ZAP)
    needs: [sast_scan, sca_scan]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v3

      - name: Subir Aplicação Localmente
        run: |
          cd modulo-devsecops/pratica-scan-automatico-shift-left
          npm install
          node index.js &
          sleep 5

      - name: Executar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'http://localhost:3000'
          fail_action: false