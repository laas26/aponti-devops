apiVersion: apps/v1
kind: Deployment
metadata:
  name: aponti-web
  labels:
    app: aponti-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aponti-web
  template:
    metadata:
      labels:
        app: aponti-web
    spec:
      containers:
        - name: web
          image: nginxdemos/hello:0.4
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
